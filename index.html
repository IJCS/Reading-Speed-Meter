<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Speed Meter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favico.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- Botón GitHub agregado -->
        <a href="https://github.com/IJCS/Reading-Speed-Meter" target="_blank" rel="noopener noreferrer" class="github-link">
            <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
        <div class="content-wrapper">
            <h1 class="title">Reading Speed Meter</h1>
            
            <div class="language-nav">
                <button id="lang-en" class="language-btn language-btn-active">English</button>
                <button id="lang-es" class="language-btn language-btn-inactive">Español</button>
                <button id="lang-ru" class="language-btn language-btn-inactive">Русский</button>
                <button id="lang-de" class="language-btn language-btn-inactive">Deutsche</button>
                <button id="lang-fr" class="language-btn language-btn-inactive">Français</button>
            </div>

            <div class="wpm-display">
                <span class="wpm-number" id="avg-wpm">—</span>
                <span class="wpm-label" id="wpm-label">WPM</span>
            </div>

            <div class="paragraph-box">
                <p class="paragraph-text" id="paragraph-text">Click Start to load a paragraph</p>
            </div>

            <div class="button-container">
                <button id="start-btn" class="start-btn">
                    <span id="start-btn-text">Start</span>
                    <span class="hotkey-hint">(Spacebar)</span>
                </button>
            </div>

            <div class="stats-bar">
                <div>
                    <span class="stat-label" id="stat-words">Words:</span> <span id="word-count">0</span>
                </div>
                <div>
                    <span class="stat-label" id="stat-seconds">Seconds:</span> <span id="seconds">0</span>
                </div>
                <div>
                    <span class="stat-label" id="stat-estimated">Estimated:</span> <span id="estimated">—</span>
                </div>
            </div>

            <div id="results-container" class="results-container" style="display: none;">
                <h2 class="results-title" id="results-text" >Results</h2>
                <div id="results-list" class="results-list"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
